<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CVly — Tableau de bord</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: white;
            padding: 20px 8%;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user {
            color: #6b7280;
        }

        .logout {
            padding: 9px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        .logout:hover {
            background: #f3f4f6;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .welcome {
            margin-bottom: 35px;
        }

        .welcome h1 {
            margin-bottom: 8px;
        }

        .welcome p {
            color: #6b7280;
        }

        .actions {
            margin-bottom: 30px;
        }

        .button {
            padding: 13px 20px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
        }

        .primary {
            background: #111827;
            color: white;
        }

        .primary:hover {
            background: #374151;
        }

        .danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .danger:hover {
            background: #fecaca;
        }

        .cv-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cv-card {
            background: white;
            border-radius: 15px;
            padding: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.05);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .cv-info {
            min-width: 0;
        }

        .cv-info h2 {
            margin-bottom: 8px;
            word-break: break-word;
        }

        .cv-info p {
            color: #6b7280;
            margin-bottom: 5px;
        }

        .cv-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .empty {
            background: white;
            padding: 60px 30px;
            text-align: center;
            border-radius: 15px;
            color: #6b7280;
        }

        .empty h2 {
            color: #111827;
            margin-bottom: 10px;
        }

        .empty p {
            margin-bottom: 20px;
        }

        .count {
            color: #6b7280;
            margin-bottom: 15px;
        }

        @media (max-width: 700px) {

            .cv-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .cv-actions {
                width: 100%;
            }

            .cv-actions button {
                flex: 1;
            }

            .user {
                display: none;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        CVly
    </div>


    <div class="header-right">

        <div
            class="user"
            id="userName"
        >
            Mon compte
        </div>


        <button
            class="logout"
            id="logoutButton"
        >
            Se déconnecter
        </button>

    </div>

</header>


<div class="container">


    <div class="welcome">

        <h1>
            Mon tableau de bord
        </h1>

        <p>
            Gère tous tes CV depuis cet espace.
        </p>

    </div>


    <div class="actions">

        <button
            class="button primary"
            id="newCV"
        >
            + Créer un CV
        </button>

    </div>


    <p
        class="count"
        id="cvCount"
    ></p>


    <div id="cvContainer"></div>


</div>


<script>


// ==================================================
// UTILISATEUR
// ==================================================

const currentUser =
    JSON.parse(
        localStorage.getItem(
            "cvlyCurrentUser"
        )
    );


if (!currentUser) {

    window.location.href =
        "login.html";

}


// ==================================================
// ÉLÉMENTS
// ==================================================

const userName =
    document.getElementById(
        "userName"
    );

const cvContainer =
    document.getElementById(
        "cvContainer"
    );

const cvCount =
    document.getElementById(
        "cvCount"
    );

const newCV =
    document.getElementById(
        "newCV"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


// ==================================================
// CLÉ DES CV
// ==================================================

const userEmail =
    currentUser.email
        .trim()
        .toLowerCase();


const usersCVKey =
    "cvlyCVs_" +
    userEmail;


// ==================================================
// NOM UTILISATEUR
// ==================================================

userName.textContent =
    currentUser.firstName +
    " • " +
    currentUser.email;


// ==================================================
// RÉCUPÉRER LES CV
// ==================================================

function getCVs() {

    return JSON.parse(
        localStorage.getItem(
            usersCVKey
        )
    ) || [];

}


// ==================================================
// SAUVEGARDER
// ==================================================

function saveCVs(cvs) {

    localStorage.setItem(
        usersCVKey,
        JSON.stringify(cvs)
    );

}


// ==================================================
// AFFICHER LES CV
// ==================================================

function afficherCVs() {

    const cvs =
        getCVs();


    cvCount.textContent =
        cvs.length +
        (
            cvs.length > 1
                ? " CV enregistrés"
                : " CV enregistré"
        );


    // Aucun CV

    if (cvs.length === 0) {

        cvContainer.innerHTML = `

            <div class="empty">

                <h2>
                    Aucun CV
                </h2>

                <p>
                    Crée ton premier CV pour commencer.
                </p>

                <button
                    class="button primary"
                    id="emptyNewCV"
                >
                    + Créer mon premier CV
                </button>

            </div>

        `;


        document
            .getElementById("emptyNewCV")
            .addEventListener(
                "click",
                creerCV
            );


        return;

    }


    // Plusieurs CV

    cvContainer.innerHTML = `

        <div class="cv-list">

            ${cvs.map(
                function(cv) {

                    const nomCV =
                        cv.cvName ||
                        "Mon CV";

                    const prenom =
                        cv.prenom ||
                        "";

                    const nom =
                        cv.nom ||
                        "";

                    const nomComplet =
                        (
                            prenom +
                            " " +
                            nom
                        ).trim();


                    return `

                        <div
                            class="cv-card"
                            data-id="${cv.id}"
                        >

                            <div class="cv-info">

                                <h2>
                                    📄 ${escapeHTML(nomCV)}
                                </h2>

                                <p>
                                    ${
                                        escapeHTML(
                                            nomComplet ||
                                            "CV sans nom"
                                        )
                                    }
                                </p>

                                <p>
                                    Modèle :
                                    ${
                                        escapeHTML(
                                            cv.modele ||
                                            "classic"
                                        )
                                    }
                                </p>

                            </div>


                            <div class="cv-actions">

                                <button
                                    class="button primary edit-button"
                                    data-id="${cv.id}"
                                >
                                    Modifier
                                </button>


                                <button
                                    class="button danger delete-button"
                                    data-id="${cv.id}"
                                >
                                    Supprimer
                                </button>

                            </div>

                        </div>

                    `;

                }
            ).join("")}

        </div>

    `;


    // Modifier

    document
        .querySelectorAll(".edit-button")
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        const id =
                            button.dataset.id;

                        window.location.href =
                            "create.html?id=" +
                            encodeURIComponent(id);

                    }
                );

            }
        );


    // Supprimer

    document
        .querySelectorAll(".delete-button")
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        supprimerCV(
                            button.dataset.id
                        );

                    }
                );

            }
        );

}


// ==================================================
// CRÉER UN NOUVEAU CV
// ==================================================

function creerCV() {

    // On crée un CV uniquement
    // quand l'utilisateur clique
    // sur le bouton.

    const cvs =
        getCVs();


    const nouveauCV = {

        id:
            Date.now().toString(),

        cvName:
            "Mon nouveau CV",

        prenom:
            currentUser.firstName || "",

        nom:
            "",

        email:
            currentUser.email || "",

        telephone:
            "",

        ville:
            "",

        profil:
            "",

        diplome:
            "",

        etablissement:
            "",

        annee:
            "",

        poste:
            "",

        entreprise:
            "",

        description:
            "",

        competences:
            "",

        modele:
            "classic",

        photo:
            ""

    };


    cvs.push(
        nouveauCV
    );


    saveCVs(
        cvs
    );


    // Ouvrir le nouveau CV

    window.location.href =
        "create.html?id=" +
        encodeURIComponent(
            nouveauCV.id
        );

}


// ==================================================
// SUPPRIMER UN CV
// ==================================================

function supprimerCV(id) {

    const confirmation =
        confirm(
            "Voulez-vous vraiment supprimer ce CV ?"
        );


    if (!confirmation) {
        return;
    }


    let cvs =
        getCVs();


    const cv =
        cvs.find(
            function(item) {
                return item.id === id;
            }
        );


    // Supprimer le CV

    cvs =
        cvs.filter(
            function(item) {
                return item.id !== id;
            }
        );


    saveCVs(
        cvs
    );


    // Supprimer également
    // la photo enregistrée
    // dans ce CV.

    if (cv) {

        cv.photo = "";

    }


    afficherCVs();

}


// ==================================================
// ÉCHAPPER LE HTML
// ==================================================

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// ==================================================
// NOUVEAU CV
// ==================================================

newCV.addEventListener(
    "click",
    creerCV
);


// ==================================================
// DÉCONNEXION
// ==================================================

logoutButton.addEventListener(
    "click",
    function() {

        localStorage.removeItem(
            "cvlyCurrentUser"
        );

        window.location.href =
            "index.html";

    }
);


// ==================================================
// DÉMARRAGE
// ==================================================

afficherCVs();


console.log(
    "✅ Dashboard multi-CV chargé"
);

</script>


</body>

</html>
