<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CVly — Crée ton CV gratuitement</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            color: #6b7280;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            padding: 15px 28px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        .button:hover {
            background: #374151;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 40px 8%;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 280px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #6b7280;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">CVly</div>
</header>

<section class="hero">
    <h1>Crée ton CV gratuitement.</h1>

    <p>
        Un CV professionnel en quelques minutes,
        sans inscription.
    </p>

    <a href="create.html" class="button">
        Créer mon CV
    </a>
</section>

<section class="features">

    <div class="card">
        <h3>⚡ Rapide</h3>
        <p>Crée ton CV en quelques minutes.</p>
    </div>

    <div class="card">
        <h3>💼 Professionnel</h3>
        <p>Un design propre adapté au monde professionnel.</p>
    </div>

    <div class="card">
        <h3>🆓 Gratuit</h3>
        <p>Aucune inscription nécessaire pour commencer.</p>
    </div>

</section>

</body>
</html>
